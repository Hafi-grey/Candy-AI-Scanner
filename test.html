<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv Test</title>
</head>

<body>

<h2>Deriv Connection Test</h2>

<p>Status: <span id="status">Connecting...</span></p>
<p>Price: <span id="price">Waiting...</span></p>
<p>Message: <span id="message">Waiting...</span></p>

<script>

const status = document.getElementById("status");
const price = document.getElementById("price");
const message = document.getElementById("message");

const ws = new WebSocket(
    "wss://ws.binaryws.com/websockets/v3"
);

ws.onopen = function () {

    status.textContent = "CONNECTED 🟢";
    message.textContent = "Requesting ticks...";

    ws.send(JSON.stringify({
        ticks: "1HZ100V",
        subscribe: 1,
        req_id: 1
    }));
};

ws.onmessage = function (event) {

    console.log(event.data);

    const data = JSON.parse(event.data);

    if (data.error) {

        status.textContent = "API ERROR ❌";
        message.textContent = data.error.message;

        return;
    }

    if (data.msg_type === "tick") {

        status.textContent = "LIVE TICK 🟢";

        price.textContent =
            data.tick.quote;

        message.textContent =
            "Receiving live ticks";

    }
};

ws.onerror = function () {

    status.textContent = "WEBSOCKET ERROR ❌";
    message.textContent = "Connection failed";

};

ws.onclose = function (event) {

    status.textContent = "CLOSED 🔴";
    message.textContent =
        "Close code: " + event.code;

};

</script>

</body>
</html>
