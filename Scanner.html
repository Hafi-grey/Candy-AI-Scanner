<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Candy Rise/Fall Scanner</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
    padding: 15px;
}

.box {
    max-width: 420px;
    margin: auto;
    background: #222;
    padding: 20px;
    border-radius: 15px;
}

h2 {
    margin-bottom: 20px;
}

.row {
    background: #333;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
}

.value {
    font-weight: bold;
}

#signal {
    font-size: 32px;
    font-weight: bold;
    margin: 25px 0;
}

#reason {
    font-size: 14px;
    color: #ccc;
}
</style>
</head>

<body>

<div class="box">

<h2>🤖 Candy Rise/Fall Scanner</h2>

<div class="row">
Status:
<span id="status" class="value">Connecting...</span>
</div>

<div class="row">
Live Price:
<span id="price" class="value">Waiting...</span>
</div>

<div class="row">
Ticks Collected:
<span id="ticks" class="value">0</span>
</div>

<div class="row">
Recent Movement:
<span id="movement" class="value">Waiting...</span>
</div>

<div class="row">
Rise:
<span id="rise" class="value">0</span>
</div>

<div class="row">
Fall:
<span id="fall" class="value">0</span>
</div>

<div id="signal">WAITING...</div>

<div class="row">
Confidence:
<span id="confidence" class="value">0%</span>
</div>

<p id="reason">Collecting market data...</p>

</div>

<script>

const status = document.getElementById("status");
const price = document.getElementById("price");
const ticksDisplay = document.getElementById("ticks");
const movementDisplay = document.getElementById("movement");
const riseDisplay = document.getElementById("rise");
const fallDisplay = document.getElementById("fall");
const signal = document.getElementById("signal");
const confidence = document.getElementById("confidence");
const reason = document.getElementById("reason");

let prices = [];
let tickCount = 0;

const MAX_HISTORY = 20;

const ws = new WebSocket(
    "wss://api.derivws.com/trading/v1/options/ws/public"
);

ws.onopen = function() {

    status.textContent = "CONNECTED 🟢";

    ws.send(JSON.stringify({
        ticks: "1HZ100V",
        subscribe: 1
    }));

};

ws.onmessage = function(event) {

    try {

        const data = JSON.parse(event.data);

        if (data.error) {
            status.textContent = "API ERROR ❌";
            reason.textContent = data.error.message;
            return;
        }

        if (!data.tick) return;

        const currentPrice = Number(data.tick.quote);

        tickCount++;

        price.textContent = currentPrice;
        ticksDisplay.textContent = tickCount;

        prices.push(currentPrice);

        if (prices.length > MAX_HISTORY) {
            prices.shift();
        }

        status.textContent = "LIVE TICK 🟢";

        /*
        Need enough prices before creating
        a signal.
        */

        if (prices.length < 6) {

            signal.textContent = "WAITING...";
            confidence.textContent = "0%";
            reason.textContent =
                "Collecting more tick data...";

            return;
        }

        let rise = 0;
        let fall = 0;

        for (let i = 1; i < prices.length; i++) {

            if (prices[i] > prices[i - 1]) {
                rise++;
            }

            if (prices[i] < prices[i - 1]) {
                fall++;
            }
        }

        riseDisplay.textContent = rise;
        fallDisplay.textContent = fall;

        /*
        Recent movement
        */

        const first =
            prices[prices.length - 6];

        const last =
            prices[prices.length - 1];

        let movement;

        if (last > first) {

            movement = "UP 📈";

        } else if (last < first) {

            movement = "DOWN 📉";

        } else {

            movement = "FLAT ➖";
        }

        movementDisplay.textContent = movement;

        /*
        Calculate strength
        */

        const total = rise + fall;

        let risePercent =
            (rise / total) * 100;

        let fallPercent =
            (fall / total) * 100;

        /*
        Conservative signal
        */

        if (
            risePercent >= 65 &&
            last > first
        ) {

            signal.textContent = "⬆️ RISE";
            confidence.textContent =
                Math.round(risePercent) + "%";

            reason.textContent =
                "Recent ticks show stronger upward movement.";

        }

        else if (
            fallPercent >= 65 &&
            last < first
        ) {

            signal.textContent = "⬇️ FALL";
            confidence.textContent =
                Math.round(fallPercent) + "%";

            reason.textContent =
                "Recent ticks show stronger downward movement.";

        }

        else {

            signal.textContent = "⏸ WAIT";
            confidence.textContent =
                Math.round(
                    Math.max(risePercent, fallPercent)
                ) + "%";

            reason.textContent =
                "Movement is not strong enough for a signal.";

        }

    }

    catch(error) {

        console.log(
            "Reading error:",
            error
        );

    }

};

ws.onerror = function() {

    status.textContent = "ERROR ❌";

    reason.textContent =
        "WebSocket connection error.";

};

ws.onclose = function(event) {

    status.textContent = "CLOSED 🔴";

};

</script>

</body>
    </html>
