<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candy AI Scanner</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Candy AI Scanner</h1>

<div class="card">

<p>Status:
<span id="status">Disconnected</span>
</p>

<p>Last Tick:
<span id="tick">0</span>
</p>

<p>Even:
<span id="even">0</span>
</p>

<p>Odd:
<span id="odd">0</span>
</p>

<p>Signal:
<span id="signal">Waiting...</span>
</p>

<button id="connectBtn">
Connect to Deriv
</button>

</div>

</div>

<script src="Script.js"></script>

</body>
</html>
